name: Monitor Económico MX — Scraper Diario

on:
  schedule:
    - cron: '30 13 * * 1-5'  # 07:30 CST (México) = 13:30 UTC, lunes a viernes
  workflow_dispatch:           # permite correrlo manualmente desde GitHub

jobs:
  scraper:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr pipeline
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          BANXICO_TOKEN:       ${{ secrets.BANXICO_TOKEN }}
          INEGI_TOKEN:         ${{ secrets.INEGI_TOKEN }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATARIO:        ${{ secrets.DESTINATARIO }}
        run: python main.py --once